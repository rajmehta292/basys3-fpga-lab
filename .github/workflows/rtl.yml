name: RTL regression

on:
  push:
  pull_request:

jobs:
  simulate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install simulation tools
        run: sudo apt-get update && sudo apt-get install -y iverilog
      - name: Run complete catalog regression
        run: ./scripts/run_catalog_checks.sh
